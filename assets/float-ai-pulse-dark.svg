<svg xmlns="http://www.w3.org/2000/svg" width="80" height="108" viewBox="0 0 80 108" role="img" aria-label="AI Pulse"><title>AI Pulse</title><style>@keyframes b{0%,100%{transform:translateY(0) rotate(-1.25deg)}50%{transform:translateY(-7px) rotate(1.25deg)}}@keyframes s{0%,100%{transform:scale(1.000);opacity:1}50%{transform:scale(0.740);opacity:.55}}.f,.s{transform-box:fill-box;transform-origin:50% 50%;animation:3.9s cubic-bezier(.45,0,.55,1) -3.3s infinite both}.f{animation-name:b}.s{animation-name:s}@media (prefers-reduced-motion:reduce){.f,.s{animation:none}.f{transform:rotate(-1.25deg)}.s{transform:scale(1.000)}}</style><defs><radialGradient id="g"><stop offset="0" stop-color="#000000" stop-opacity="1"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient></defs><ellipse class="s" cx="40" cy="97" rx="23" ry="5" fill="url(#g)"/><g class="f"><image x="14" y="30" width="52" height="52" href="data:image/svg+xml;base64,"/></g></svg>
