<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#101b2b">
    <meta name="description" content="Play Snake on Michael Chen’s last three months of GitHub contributions.">
    <title>Contribution Snake · Michael Chen</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./play.mjs"></script>
  </head>
  <body>
    <main class="arcade">
      <header class="masthead">
        <a class="back" href="https://github.com/mwc2150">Michael Chen on GitHub</a>
        <h1>Contribution<br><span>Snake</span></h1>
      </header>

      <section class="cabinet" aria-label="Snake game">
        <div class="hud">
          <div>
            <p class="label">Contribution window</p>
            <p id="date-range" class="date-range">Loading calendar…</p>
          </div>
          <div class="scorebox">
            <p class="label">Score</p>
            <p class="score"><span id="score">0</span><span id="total"></span></p>
          </div>
        </div>

        <div class="screen" id="screen" aria-hidden="true" hidden>
          <div class="months" id="months"></div>
          <div class="board" id="board"></div>
        </div>

        <div class="game-controls">
          <div class="actions">
            <p class="status" id="status" role="status">Loading the board…</p>
            <div class="buttons">
              <button type="button" id="action" class="primary" disabled>Start game</button>
              <button type="button" id="restart" class="secondary" hidden>Restart</button>
            </div>
            <p class="keys">Arrow keys or WASD to move.</p>
          </div>
          <div class="dpad" role="group" aria-label="Direction controls">
            <button type="button" data-direction="up" aria-label="Up" disabled>↑</button>
            <button type="button" data-direction="left" aria-label="Left" disabled>←</button>
            <button type="button" data-direction="down" aria-label="Down" disabled>↓</button>
            <button type="button" data-direction="right" aria-label="Right" disabled>→</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
